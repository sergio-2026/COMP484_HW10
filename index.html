<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GigaPet – DevTools Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>GigaPet – Mr Bean</h1>
  </header>

  <main>
    <p>
      Use the buttons to take care of your pet. Then open Chrome DevTools to see
      logs, errors, and other messages for your Project 10 homework.
    </p>

    <!-- DevTools demo: broken image to cause 404 network error -->
    <!-- This file does NOT exist on purpose. Chrome will show a 404. -->
    <img src="images/does-not-exist.png"
         alt="broken debug image"
         style="display:none;">

    <div class="pet-wrapper">
      <div class="pet-image-container">
        <img class="pet-image" src="images/dog-happy.jpg" alt="Mr Bean the dog">
      </div>

      <div class="dashboard">
        <div>
          <span class="bold">Name:</span>
          <span class="name"></span>
        </div>
        <div>
          <span class="bold">Weight:</span>
          <span class="weight"></span>
        </div>
        <div>
          <span class="bold">Happiness:</span>
          <span class="happiness"></span>
        </div>
        <div>
          <span class="bold">Energy:</span>
          <span class="energy"></span>
        </div>

        <div class="button-container">
          <button class="treat-button">Treat</button>
          <button class="play-button">Play</button>
          <button class="exercise-button">Exercise</button>
          <button class="nap-button">Nap</button>
        </div>

        <p class="pet-comment"></p>
      </div>
    </div>
  </main>

  <footer>
    <p>
      Tip: Press <span class="bold">F12</span> or <span class="bold">Ctrl+Shift+I</span>
      (Windows) to open Chrome DevTools and view the Console.
    </p>
  </footer>

  <!-- jQuery from CDN (same style as class examples) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Your project code -->
  <script src="script.js"></script>
</body>
</html>
